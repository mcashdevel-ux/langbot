name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject's requires-python and the current release:
        # 3.10 catches syntax that only newer CPython accepts (see C1 in
        # CODE_REVIEW.md, an f-string backslash that needed 3.12).
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # requirements-dev.txt pulls the runtime deps too, torch among them,
          # so the wheel cache is the difference between a fast and a slow run.
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest
        env:
          # CONTRIBUTING forbids tests that touch the network or a live model;
          # offline mode turns a violation into a failure here rather than a
          # silent download on someone's machine.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m pytest
